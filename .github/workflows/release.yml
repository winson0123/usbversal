# Cut a GitHub Release with native binaries when a v* tag is pushed.
# See docs/workflows/release-workflow.md.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest

  build:
    name: Build ${{ matrix.asset }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: usbversal-linux-x86_64
          - os: windows-latest
            asset: usbversal-windows-x86_64.exe
          - os: macos-latest
            asset: usbversal-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Build
        run: python -m PyInstaller --noconfirm packaging/usbversal.spec
      - name: Name the artifact
        shell: bash
        run: |
          mkdir -p release
          if [[ -f dist/usbversal.exe ]]; then
            cp dist/usbversal.exe "release/${{ matrix.asset }}"
          else
            cp dist/usbversal "release/${{ matrix.asset }}"
          fi
          test -s "release/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/usbversal-linux-x86_64 \
            artifacts/usbversal-windows-x86_64.exe \
            artifacts/usbversal-macos-arm64
