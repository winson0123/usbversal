[project]
name = "usbversal"
version = "0.1.0"
description = "Safe DJ database CLI for USB-mounted Rekordbox and Serato libraries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rbox>=0.1.7",
    "serato-tools>=4.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
