[project]
name = "usbversal"
version = "0.1.0"
description = "TUI that copies Rekordbox playlists, beatgrids, and hot cues onto Serato on a USB stick"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rbox>=0.1.7",
    "serato-tools>=4.0.0",
    "structlog>=24.0.0",
    "textual>=8.0.0",
]

[project.scripts]
usbversal = "app.tui.app:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.4.0",
    "pyinstaller>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
